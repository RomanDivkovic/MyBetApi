version: 2.1

executors:
  dotnet-executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/repo

jobs:
  deploy:
    docker:
      - image: docker:20.10
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t your-docker-repo/mybetapi .
      - run:
          name: Push Docker Image
          command: docker push your-docker-repo/mybetapi:latest
  build-and-test:
    executor: dotnet-executor
    steps:
      - checkout
      - run:
          name: Restore NuGet packages
          command: dotnet restore
      - run:
          name: Build the project
          command: dotnet build --no-restore
      - run:
          name: Run tests
          command: dotnet test --no-build

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test
