[build]
builder = "NIXPACKS"
buildCommand = "docker pull divkovicroman/mybetapi:latest && docker run -p 8080:80 divkovicroman/mybetapi:latest"

[deploy]
region = "us-west2"
runtime = "V2"
numReplicas = 1
sleepApplication = false
multiRegionConfig = {"us-west2":{"numReplicas":1}}
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
